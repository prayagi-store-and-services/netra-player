name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-diagnostics
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee app/build/ci-diagnostics/android-build.log
      - name: Record resolved app dependencies for advisory review
        run: |
          mkdir -p app/build/ci-diagnostics
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > app/build/ci-diagnostics/release-runtime-dependencies.txt
      - name: Upload build log and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/ci-diagnostics/android-build.log
            app/build/ci-diagnostics/release-runtime-dependencies.txt
          if-no-files-found: warn

      - name: Upload test APK for device verification
        uses: actions/upload-artifact@v4
        with:
          name: NetraPlayer-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare local document fixtures
        run: |
          mkdir -p /tmp/player-fixtures
          echo '' | base64 -d > /tmp/player-fixtures/a-video.mp4
          cp /tmp/player-fixtures/a-video.mp4 /tmp/player-fixtures/b-video.mp4
          printf '1\n00:00:00,000 --> 00:00:29,000\nLOCAL SUBTITLE CHECK\n' > /tmp/player-fixtures/caption.srt
          echo 'Not media' > /tmp/player-fixtures/ignore.txt
      - name: Device smoke and screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash scripts/device-tests.sh
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Player-device-evidence
          path: |
            app/build/device-screenshots/
            app/build/reports/androidTests/
          if-no-files-found: warn
