name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must equal v plus versionName in app/build.gradle.kts, for example v1.0.1)
        required: true
      expected_head:
        description: Exact independently reviewed main SHA
        required: true
      publish:
        description: Stage a draft only, after verified candidate artifact review and final green head
        required: true
        type: boolean
        default: false
      notes:
        description: What changed (shown in the in-app update prompt)
        required: true
        default: Bug fixes and improvements.

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refuse publication from non-main ref
        if: ${{ inputs.publish == true && github.ref != 'refs/heads/main' }}
        run: exit 1
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require exact reviewed main head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Refuse duplicate or non-monotonic release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VNAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VCODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$TAG" = "v$VNAME"
          gh release list --limit 100 --json tagName > "$RUNNER_TEMP/release-history.json"
          jq -e --arg tag "$TAG" 'all(.[]; .tagName != $tag)' "$RUNNER_TEMP/release-history.json"
          gh release view --json tagName --jq .tagName > "$RUNNER_TEMP/previous-tag.txt"
          PREVIOUS="$(cat "$RUNNER_TEMP/previous-tag.txt")"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$PREVIOUS" --pattern latest.json --pattern app-release.apk --dir "$RUNNER_TEMP/previous-release"
          OLD_CODE="$(jq -er '.versionCode | numbers' "$RUNNER_TEMP/previous-release/latest.json")"
          test "$VCODE" -gt "$OLD_CODE"
          EXPECTED_SHA="$(jq -er '.sha256' "$RUNNER_TEMP/previous-release/latest.json")"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/previous-release/app-release.apk" | sha256sum --check --strict
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netra-release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/netra-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify the APK is signed
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          set -euo pipefail
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/candidate-certs.txt"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/previous-release/app-release.apk" | tee "$RUNNER_TEMP/previous-certs.txt"
          EXPECTED=543b46402206ae0022d352f65bea618386bd7aa681b4d5bcfb5ce02bac49c8c4
          for label in candidate previous; do
            ACTUAL="$(python3 -c 'import re,sys; lines=[s.strip() for s in open(sys.argv[1]) if "certificate SHA-256 digest:" in s]; assert len(lines)==1, "Expected exactly one signer certificate digest"; m=re.fullmatch(r"(?:Signer #1|V2 Signer:) certificate SHA-256 digest: ([0-9a-fA-F]{64})",lines[0]); assert m, "Unrecognized signer certificate format"; print(m[1].lower())' "$RUNNER_TEMP/$label-certs.txt")"
            test "$ACTUAL" = "$EXPECTED"
          done
      - name: Verify candidate package and version
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.prayagi.netraplayer' versionCode='32' versionName='1.1.16.10'" "$RUNNER_TEMP/badging.txt"
      - name: Upload verified signed candidate
        uses: actions/upload-artifact@v7
        with:
          name: verified-signed-candidate-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Stage draft release
        if: ${{ inputs.publish == true && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          D=app/build/outputs/apk/release
          VNAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VCODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$TAG" = "v$VNAME"
          # Named copy for people. app-release.apk stays because the in-app updater needs that exact name.
          NAMED="$D/NetraPlayer-$TAG.apk"
          cp "$D/app-release.apk" "$NAMED"
          SHA="$(sha256sum "$D/app-release.apk" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$D/app-release.apk")"
          jq -n --arg tag "$TAG" --arg vn "$VNAME" --argjson vc "$VCODE" --arg sha "$SHA" --argjson size "$SIZE" --arg notes "$NOTES" \
            '{tag:$tag,versionName:$vn,versionCode:$vc,sha256:$sha,size:$size,notes:$notes}' > "$D/latest.json"
          gh release create "$TAG" "$D/app-release.apk" "$NAMED" "$D/latest.json" --draft \
            --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
